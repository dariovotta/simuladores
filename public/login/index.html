<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | MisFinanzas</title>
    <meta name="robots" content="noindex">
    <script src="../assets/js/theme-init.js"></script>
    <style>html{background:#F4F6F9}html[data-theme="dark"]{background:#07110D}</style>
    <script type="speculationrules">{"prerender":[{"where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":"/api/*"}}]},"eagerness":"moderate"}]}</script>
    <link rel="icon" href="../assets/img/brand/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/tokens.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/transitions.css">
    <link rel="stylesheet" href="../assets/css/pages/login.css">
    <script type="module" src="../assets/js/pages/login.js" blocking="render"></script>
</head>
<body data-page="login">

<div data-slot="header"></div>

<main class="main screen auth">
    <section class="card auth-card">
        <h1 class="auth-title" id="authTitle">Ingresá a tu cuenta</h1>
        <p class="auth-lead">Con tu cuenta podés guardar simulaciones y volver a abrirlas cuando quieras.</p>

        <div class="segmented auth-seg" role="group" aria-label="Modo">
            <button type="button" class="segmented__btn" data-mode="login" aria-pressed="true">Ingresar</button>
            <button type="button" class="segmented__btn" data-mode="register" aria-pressed="false">Crear cuenta</button>
        </div>

        <form class="auth-form" id="authForm" novalidate>
            <div class="field">
                <label class="field__label" for="email">Email</label>
                <input class="input" id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label class="field__label" for="password">Contraseña</label>
                <input class="input" id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
                <span class="field__hint hidden" id="passwordHint">Mínimo 8 caracteres.</span>
            </div>
            <p class="dialog__error" id="authError" role="alert"></p>
            <button class="btn btn--primary auth-submit" id="authSubmit" type="submit">Ingresar</button>
        </form>
    </section>
</main>

</body>
</html>
